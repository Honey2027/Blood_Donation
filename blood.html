<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LifeLink - Blood Donation</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="blood.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-danger" href="#">LifeLink</a>
  </div>
</nav>

<!-- Hero -->
<section class="hero d-flex align-items-center">
  <div class="container text-center">
    <h1 class="fw-bold">Donate Blood. Save Lives.</h1>
    <p class="text-muted">A simple platform to connect donors with people in need</p>
  </div>
</section>

<!-- Main -->
<div class="container my-5">
  <div class="row g-4">

    <!-- Register -->
    <div class="col-md-5">
      <div class="card p-4 shadow-sm">
        <h4 class="mb-3">Become a Donor</h4>

        <input type="text" id="name" class="form-control mb-2" placeholder="Full Name">

        <select id="blood" class="form-select mb-2">
          <option value="">Select Blood Group</option>
          <option>A+</option><option>B+</option><option>O+</option>
          <option>AB+</option><option>A-</option><option>B-</option>
          <option>O-</option><option>AB-</option>
        </select>

        <input type="text" id="city" class="form-control mb-2" placeholder="City">

        <button class="btn btn-danger w-100" onclick="register()">Register</button>
      </div>
    </div>

    <!-- Search -->
    <div class="col-md-7">
      <div class="card p-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4>Find Donors</h4>
          <select id="searchBlood" class="form-select w-50">
            <option value="">All</option>
            <option>A+</option><option>B+</option><option>O+</option>
            <option>AB+</option><option>A-</option><option>B-</option>
            <option>O-</option><option>AB-</option>
          </select>
        </div>

        <div id="result" class="row g-3"></div>
      </div>
    </div>

  </div>
</div>

<!-- Footer -->
<footer class="text-center py-3 text-muted">
  © 2026 LifeLink
</footer>

<script src="blood.js"></script>
</body>
</html>
